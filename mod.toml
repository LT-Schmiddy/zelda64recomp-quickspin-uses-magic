# Config file for an example Majora's Mask: Recompiled mod.

# Fields that end up in the mod's manifest.
[manifest]

# Unique ID of this mod. Pick something long enough that it'll never be the same as any other mod.
# The name displayed in the mod management menu is separate from this so this doesn't need to be human readable.
id = "mm_quickspins_use_magic"

# Version of this mod.
version = "1.0.0"

# The name that will show up for this mod in the mod menu. This should be human readable.
display_name = "Quickspins Use Magic"

# The description that will show up when this mod is displayed in the mod menu. This should be human readable.
description =  """
This is a small balance change I've wanted for a while now.

Due to some bizzare oversight, quick-spins do not cost any magic to perform, unlike regular spin-attacks. 
For those who have practiced the move to consistency, simply spamming quick-spins becomes the optimal strategy in most fights.

This mod makes the move cost magic, like it's charged counterpart. Optionally, you can have quick-spins cost more magic than 
regular spin-attacks, a cost for quicker deployment of the move. The default amount is 2x.

I'm of the opinion that this makes fighting in the game more dymanic and interesting, and is just more fun overall.
"""

# A short description that will show up in this mod's entry in the mod list. This should be human readable and kept short
# to prevent it from being cut off due to the limited space.
short_description = "Quick-spins now require magic to use."

# Authors of this mod.
authors = [ "LT_Schmiddy" ]

# ID of the target recomp game.
game_id = "mm"

# Minimum version of the target recomp (e.g. Zelda 64: Recompiled) that this mod can run on.
minimum_recomp_version = "1.2.0"

# Dependency mods. Each entry is the mod's ID and then an optional minimum version of the dependency mod.
dependencies = [
# Example dependency:
#    "modname:1.0.0"
]

# Native libraries (e.g. DLLs) and the functions they export.
native_libraries = [
# Example native library:
#    { name = "my_native_library", funcs = ["my_native_library_function"] }
]

# Inputs to the mod tool.
[inputs]

# Input elf file to generate a mod from.
elf_path = "build/mod.elf"

# Output mod filename.
mod_filename = "mm_quickspins_use_magic"

# Reference symbol files.
func_reference_syms_file = "Zelda64RecompSyms/mm.us.rev1.syms.toml"
data_reference_syms_files = [ "Zelda64RecompSyms/mm.us.rev1.datasyms.toml", "Zelda64RecompSyms/mm.us.rev1.datasyms_static.toml", "custom_static_datasyms.toml" ]

# Additional files to include in the mod.
additional_files = [ 
    "thumb.dds"
]

[[manifest.config_options]]
id = "magic_use_multiplier"
name = "Magic Use Mutliplier"
description = "The magic use of a quick-spin is the damage of a normal spin-attack times this value."
type = "Number"
min = 1
max = 10
step = 1
precision = 1
percent = false
default = 2

